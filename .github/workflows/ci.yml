name: ci

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff scipy pandas numpy scikit-learn
      - run: ruff check src scripts
      - run: ruff format --check src scripts
      - run: python -c "from src.evaluate_ks import ks_score; import numpy as np; assert ks_score(np.array([0,0,1,1]), np.array([0.1,0.2,0.8,0.9])) > 0.9"
